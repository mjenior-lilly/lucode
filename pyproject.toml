[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "lucode"
# Version is derived from git tags at build time (see [tool.uv-dynamic-versioning]).
# On a tag it is the plain tag (e.g. `0.1.0`); between tags it carries the commit
# count and short hash (e.g. `0.1.0+14.g93986a8`) so a reported version maps back
# to an exact commit.
dynamic = ["version"]
description = "Configure and launch Pi and OpenCode through Databricks AI Gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.5",
  "httpx>=0.27.1",
  # `lucode mcp-proxy` bridges a client's stdio MCP transport to a Databricks
  # streamable-HTTP MCP endpoint, injecting an OAuth or activated PAT bearer.
  # Uses the official MCP SDK's stdio server + streamable-HTTP client.
  "mcp>=1.28.0",
  "prompt-toolkit>=2.0,<4.0",
  "questionary>=2.0.0",
  "rich>=12.3.0",
  "typer>=0.12.0",
]

[project.scripts]
lucode = "lucode.cli:main"
lpi = "lucode.cli:lpi_main"

[tool.hatch.build.targets.wheel]
# lucode/defaults/*.json ships automatically as package data under this tree. It
# carries gateway-verified per-model tuning (context windows, output caps,
# thinking-level maps) that discovery cannot reproduce, and is read via
# importlib.resources in lucode/model_tuning.py, so it must stay inside the
# package rather than living in a repo-only directory.
packages = ["src/lucode"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[[tool.uv.index]]
name = "lilly"
url = "https://elilillyco.jfrog.io/artifactory/api/pypi/Lilly-Python/simple"
default = true

[tool.uv-dynamic-versioning]
vcs = "git"
# On a tagged commit: plain tag (e.g. `0.1.0`). Between tags: append the commit
# count and short hash as a local segment (e.g. `0.1.0+14.g93986a8`) so a
# reported version points back to an exact commit for bug reports.
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ base }}+{{ distance }}.g{{ commit }}{% endif %}"
# Used only when git metadata is unavailable at build time (e.g. building from a
# source archive with no `.git`). The normal install paths clone the repo, so
# this is a last-resort so builds degrade instead of hard-failing.
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False in tests is fine
