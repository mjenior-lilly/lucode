name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_INDEX_LILLY_USERNAME: ${{ secrets.UV_INDEX_LILLY_USERNAME }}
      UV_INDEX_LILLY_PASSWORD: ${{ secrets.UV_INDEX_LILLY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - run: uv run --locked pytest --ignore=tests/test_e2e.py --ignore=tests/test_e2e_uc.py --ignore=tests/test_e2e_user_agent.py

  e2e:
    runs-on: ubuntu-latest
    env:
      UCODE_TEST_WORKSPACE: ${{ secrets.UCODE_TEST_WORKSPACE }}
      DATABRICKS_HOST: ${{ secrets.UCODE_TEST_WORKSPACE }}
      # A hosted runner has no Databricks user-OAuth cache. Supply a short-lived
      # bearer so auth never falls back to an interactive browser login.
      DATABRICKS_BEARER: ${{ secrets.DATABRICKS_BEARER }}
      UV_INDEX_LILLY_USERNAME: ${{ secrets.UV_INDEX_LILLY_USERNAME }}
      UV_INDEX_LILLY_PASSWORD: ${{ secrets.UV_INDEX_LILLY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: databricks/setup-cli@bdb89f81c11a5bd647fd55b585b7c396ec68a25a  # v1.0.0
      - name: Install agent CLIs from Lilly Artifactory
        run: >-
          npm install -g
          --registry=https://elilillyco.jfrog.io/artifactory/api/npm/npm/
          opencode-ai
          @earendil-works/pi-coding-agent
      - run: uv tool install --locked .
      - run: uv run --locked pytest tests/test_e2e.py tests/test_e2e_uc.py tests/test_e2e_user_agent.py -v < /dev/null
